[server]
enableStaticServing = true
# Watch project files and rerun the app automatically when one is saved.
fileWatcherType = "auto"
runOnSave = true

[client]
toolbarMode = "viewer"

[theme]
base = "dark"
# Shared by light and dark. Per-mode colors live in [theme.light] / [theme.dark];
# keep them in sync with the light-dark() colors in dashboard_ui.py (render_dashboard).
font = "Aptos, Calibri, sans-serif"
headingFont = "Aptos Display, Aptos, Calibri, sans-serif"
baseFontSize = 15
headingFontSizes = ["30px", "25px", "20px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "2.4rem"
metricValueFontWeight = 400
baseRadius = "6px"
buttonRadius = "6px"
showSidebarBorder = false
paddingTop = "0.35rem"
paddingBottom = "2rem"

[theme.light]
primaryColor = "#0f766e"
backgroundColor = "#f2f6f7"
secondaryBackgroundColor = "#f6f9fa"
textColor = "#172e36"
borderColor = "#d6e1e4"
dataframeBorderColor = "#e1e8e5"
dataframeHeaderBackgroundColor = "#e6f2f1"
dataframeHeaderTextColor = "#1f4f4a"
chartCategoricalColors = ["#0f766e", "#d97706", "#4f46e5", "#e11d48", "#0284c7"]

[theme.light.sidebar]
backgroundColor = "#e4eff1"
secondaryBackgroundColor = "#f5f6f1"
paddingTop = "1.25rem"

[theme.dark]
primaryColor = "#0f766e"
backgroundColor = "#0b1417"
secondaryBackgroundColor = "#16252a"
textColor = "#e3ece9"
borderColor = "#22343a"
dataframeBorderColor = "#263739"
dataframeHeaderBackgroundColor = "#1c2c2f"
dataframeHeaderTextColor = "#b9cfc8"
chartCategoricalColors = ["#2dd4bf", "#fbbf24", "#818cf8", "#fb7185", "#38bdf8"]

[theme.dark.sidebar]
backgroundColor = "#132124"
secondaryBackgroundColor = "#1a2a2d"
paddingTop = "1.25rem"

[[theme.fontFaces]]
family = "Aptos"
url = "app/static/fonts/Aptos-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Aptos"
url = "app/static/fonts/Aptos-Bold.ttf"
weight = 700

[[theme.fontFaces]]
family = "Aptos Display"
url = "app/static/fonts/AptosDisplay-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Aptos Display"
url = "app/static/fonts/AptosDisplay-Bold.ttf"
weight = 600
