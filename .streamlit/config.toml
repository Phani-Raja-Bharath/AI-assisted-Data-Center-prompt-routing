[server]
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#176b62"
backgroundColor = "#f5f3ed"
secondaryBackgroundColor = "#eceae2"
textColor = "#172e36"
font = "Aptos, Calibri, sans-serif"
headingFont = "Aptos Display, Aptos, Calibri, sans-serif"
baseFontSize = 16
headingFontSizes = ["36px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "2.4rem"
metricValueFontWeight = 400
baseRadius = "6px"
buttonRadius = "6px"
borderColor = "#d4d8cf"
showSidebarBorder = false
paddingTop = "1.25rem"
paddingBottom = "2rem"
chartCategoricalColors = ["#176b62", "#c17b45", "#6f7b9b"]

[theme.sidebar]
backgroundColor = "#e8ebe4"
secondaryBackgroundColor = "#f5f6f1"
paddingTop = "1.25rem"

[[theme.fontFaces]]
family = "Aptos"
url = "app/static/fonts/Aptos-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Aptos"
url = "app/static/fonts/Aptos-Bold.ttf"
weight = 700

[[theme.fontFaces]]
family = "Aptos Display"
url = "app/static/fonts/AptosDisplay-Regular.ttf"
weight = 400

[[theme.fontFaces]]
family = "Aptos Display"
url = "app/static/fonts/AptosDisplay-Bold.ttf"
weight = 600
